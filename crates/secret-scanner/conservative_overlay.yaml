  anchors: [sshpass, login]
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: client_password
# The body lines under a private-key header. The corpus `private-key` rule reports a whole
# block, header to footer; a block cut short by `head` or by an output limit ends before
# its footer, and its body lines are key material all the same. Up to four `Name: value`
# lines (PGP armor headers, `Proc-Type` and `DEK-Info` of an encrypted PEM) and one blank
# line may stand between the header and the body; lines may be indented and may end in
# blanks, and a line break may be written `\n` or `\u000a`. A body line holds 16 or
# more Base64 characters, so a header followed by `...` or by prose stays as written. A
# last line of 1 to 15 Base64 characters joins the body when it is a whole line. The two
# unnamed groups are the body with and without that line; the evaluator reports the one
# that matched.
- name: magic-private-key-body
  regex: '(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z][A-Za-z0-9-]{0,30}:[^\n\\]{0,200}){0,4}(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*)?[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*(?:([A-Za-z0-9+/=]{16,}(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z0-9+/=]{16,})*[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z0-9+/=]{1,15})[\t ]*(?:(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))|\\?["''`]|\z)|([A-Za-z0-9+/=]{16,}(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z0-9+/=]{16,})*))'
  anchors: ['-----begin']
  radius: 256
