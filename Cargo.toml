[workspace]
resolver = "3"
members = [
    "crates/cache-stability",
    "crates/lease",
    "crates/storage-types",
    "crates/storage",
    "crates/shm-transport",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ahrav/eidnara"
publish = false

[workspace.dependencies]
storage-types = { path = "crates/storage-types" }
lease = { path = "crates/lease" }
shm-transport = { path = "crates/shm-transport" }
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
sha2 = "0.10"
libc = "0.2"
getrandom = "0.2"
