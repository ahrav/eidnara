# SQLite's allocation statistics guard every malloc with one process-wide mutex.
# Parallel daemon tests contend on it and miss their wall-clock deadlines, and no
# production code reads the statistics, so the bundled library is built without
# them. `crates/memory-store/tests/sorter_spill.rs` turns them on for its own process.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
