[package]
name = "host-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Directly linked host for the context, LocalEmbeddings, and ModelExecution components."

[features]
# `test-support` re-exports `host_status_response_json` at the crate root for downstream integration tests.
# The function is `pub` inside the crate; the feature gates only the cross-crate re-export.
test-support = []

[dependencies]
serde = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
fastembed = { version = "=6.0.0", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
tokenizers = { version = "=0.22.2", default-features = false }
tokio = { workspace = true, features = ["process"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { workspace = true, features = ["event", "fs", "net", "pipe", "process", "thread"] }
getrandom = { workspace = true }
libc = { workspace = true }
shm-transport = { workspace = true }
# The pinned AWS profile parser admits captured configuration bytes; no credential provider or process feature.
aws-runtime = { version = "=1.10.0", default-features = false }
aws-types = { version = "=1.6.0", default-features = false }
zeroize = { workspace = true, features = ["serde"] }
# The early credential helper acquires one row through the pinned SDK: SSO and STS only, no process or login provider.
aws-config = { version = "=1.12.0", default-features = false, features = ["default-https-client", "rt-tokio", "sso"] }
aws-credential-types = { version = "=1.3.0", default-features = false }
aws-smithy-http-client = { version = "=1.4.2", default-features = false, features = ["rustls-aws-lc"] }
aws-smithy-async = { version = "=1.3.0", default-features = false }
aws-smithy-runtime-api = { version = "=1.18.0", default-features = false, features = ["client", "http-1x"] }

[dev-dependencies]
aws-smithy-types = "=1.8.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "signal"] }
rustix = { workspace = true, features = ["stdio"] }

[[test]]
name = "model_execution_subprocess"
harness = false
