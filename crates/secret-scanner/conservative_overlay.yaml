  anchors: ['://']
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: url_password
# `-p` names a password only for a program that defines it so; elsewhere it is a port, a
# path, or a process id. The MySQL and MariaDB clients read the password attached to the
# option. The program stands as a command word (at the start of the text or after a
