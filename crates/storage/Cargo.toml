[package]
name = "storage"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Backend mechanics (open, versioned migrations, single-writer lease) for module storage."

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
storage-types = { workspace = true }
lease = { workspace = true }
rusqlite = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
