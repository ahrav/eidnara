  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  credential_form: digits
# RFC 7617 credentials: the Base64 of `user:password`, which anyone can decode. The
# validator requires that decoding, so `Basic authentication` in prose is left alone.
- name: magic-basic-authorization
  regex: '(?i)(?:\\(?:[nrt]|u000[aAdD9])|\b)Authorization[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*Basic[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]+(?P<value>[A-Za-z0-9+/_-]{4,}={0,2})'
  anchors: [authorization]
  radius: 256
  unicode: true
  value_group: value
  offline_validation:
    type: basic_credentials
# RFC 3986 userinfo with a password. The user name runs to the first `:` and the password
# ends at the last `@` of the authority. A leading `$`, `[`, or `{` marks a variable or a
