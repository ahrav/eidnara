[package]
name = "host-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Directly linked host for the context, Synapse, and Broca components."

[dependencies]
serde = { workspace = true }
subtle = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { workspace = true, features = ["event", "fs", "net", "process", "thread"] }
getrandom = { workspace = true }
shm-transport = { workspace = true }

[dev-dependencies]
hmac = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "signal"] }
rustix = { workspace = true, features = ["stdio"] }
criterion = "=0.8.2"
hdrhistogram = "=7.6.0"

[[bench]]
name = "ipc_budget"
harness = false
