[package]
name = "context-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cache-stability core: pass classifier over cache-stability, decay curve, redaction policy, and the claim-operation encoding, origin-agnostic."

[features]
default = ["cache-core"]
cache-core = ["dep:cache-stability"]

[dependencies]
cache-stability = { workspace = true, optional = true }
secret-scanner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "redaction"
harness = false

[[bench]]
name = "windowed"
harness = false
