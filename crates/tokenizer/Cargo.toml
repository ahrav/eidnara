[package]
name = "tokenizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Claude byte-BPE token counting, matching ai-tokenizer's claude encoding id for id."

[dependencies]
# Exact pin: the golden test pins token ids that depend on `CoreBPE`'s merge loop, so a patch
# release must not move under it. Bump deliberately and rerun `tests/token_golden.rs`.
tiktoken-rs = "=0.11.0"
fancy-regex = "0.17"
base64 = "0.22"
rustc-hash = "1.1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
proptest = "1.11"
