name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Predecessor tokens
        # Names from the source repositories must not survive in tracked files.
        # `docs/plans/` is excluded; bracketed characters prevent self-matches.
        # `-I` skips binary files (ONNX model, embedding fixture, fuzz corpus).
        # `(^|[^0-9a-z])` anchors a token start so `_` counts as a boundary under `-i`.
        # The second pass reads each file as one record so a token split across a line break still matches.
        # `git grep` exits 1 on no match; `xargs` exits 123 when every grep batch found nothing.
        run: |
          status=0
          git grep -n -I -i -E 'c[o]rtex[-_]?kit|magic[-_ ]?context|ck[-_](mc|lease|store|cache|core)\b|(^|[^0-9a-z])mc[-_](host|shm|tokenizer|store|kernel|module|core|secret|runtime|daemon|vector|retrieval)|(^|[^0-9a-z])(mc|ck)[_]|primitives[@][0-9a-f]{7,40}|host[@][0-9a-f]{7,40}|"repo":\s*"(primitives|host)"|"source_repo":\s*"(primitives|host)"' -- ':!docs/plans/' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "predecessor tokens found"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "git grep failed with exit $status"
            exit 1
          fi
          status=0
          matches=$(git ls-files -z -- ':!docs/plans/' | xargs -0 grep -l -I -i -z -E 'c[o]rtex[-_[:space:]]?kit|magic[-_[:space:]]?context') || status=$?
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "predecessor tokens found across a line break"
            exit 1
          fi
          if [ "$status" -ne 123 ]; then
            echo "grep failed with exit $status"
            exit 1
          fi

      - name: Migration machinery
        # Schema-migration identifiers must not appear outside test files and
        # prose. Inline `#[cfg(test)]` modules are scanned on purpose.
        # `git grep` exits 1 on no match; any other non-zero status is a tool failure.
        run: |
          status=0
          git grep -n -I -i -E 'schema[_]migrations|\bmigrat(e|ions?)[_(]|ensure[_]?column|run[_]migrations|apply[_]migrations|latest[_]migration|bootstrap[_]migration|oldest[_]adoptable' -- ':!**/tests/**' ':!migration/' ':!docs/' ':!NOTICE' ':!*.md' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "migration machinery found"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "git grep failed with exit $status"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install TypeScript tooling
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Rust toolchains
        run: |
          rustup toolchain install 1.98 --profile minimal --component clippy,rustfmt
          rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Rust format
        run: cargo +1.98 fmt --all -- --check

      - name: Rust lint (1.98)
        run: cargo +1.98 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust lint (stable)
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust tests (1.98)
        run: cargo +1.98 test --workspace --all-targets --all-features --locked

      - name: Rust doctests and docs (1.98)
        run: |
          cargo +1.98 test --workspace --doc --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo +1.98 doc --workspace --no-deps --all-features --locked

      - name: Rust tests (stable)
        run: cargo +stable test --workspace --all-targets --all-features --locked

      - name: Rust unsafe boundary under Miri
        # A dated nightly keeps this required gate reproducible; bump the date deliberately.
        # `cargo miri test` exits zero when its filter matches no tests, so the final grep
        # fails the step unless at least one test ran and passed.
        env:
          MIRI_TOOLCHAIN: nightly-2026-07-27
        run: |
          set -euo pipefail
          rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri
          cargo "+$MIRI_TOOLCHAIN" miri setup
          cargo "+$MIRI_TOOLCHAIN" miri test -p shm-transport --lib --locked -- lease:: backend::ring::miri 2>&1 | tee miri.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' miri.log

      - name: Rust ring under valgrind memcheck
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind --tool=memcheck --leak-check=full --errors-for-leak-kinds=definite --trace-children=yes --error-exitcode=1
          EIDNARA_SHM_SKIP_TWO_PROCESS: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          cargo +1.98 test -p shm-transport --test ring --locked

      - name: Feature configurations (1.98)
        run: |
          cargo +1.98 check --workspace --no-default-features --locked
          cargo +1.98 check --workspace --all-features --locked

      - name: Fuzz workspace (excluded from the root workspace)
        run: |
          cargo +1.98 fmt --manifest-path crates/shm-transport/fuzz/Cargo.toml --all -- --check
          cargo +1.98 check --manifest-path crates/shm-transport/fuzz/Cargo.toml --locked --bins
          cargo +stable check --manifest-path crates/shm-transport/fuzz/Cargo.toml --locked --bins

      - name: Pinned toolchain with unlocked latest dependencies
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          git archive HEAD | tar -x -C "$scratch"
          cd "$scratch"
          cargo +1.98 update
          cargo +1.98 check --workspace --all-targets --all-features

      - name: Native addon package (Bun)
        # The addon loads a release build of the cdylib; the package tests then drive the
        # setup handshake, ring geometry, buffer bounds, and detachment through N-API.
        # The claimed-target flag makes an addon-load failure fail the suite instead of
        # skipping the tests that need the artifact.
        env:
          EIDNARA_SHM_NATIVE_CLAIMED_TARGET: "1"
        run: |
          bun run --cwd packages/shm-native build:native
          bun run --cwd packages/shm-native typecheck
          bun run --cwd packages/shm-native test
          bun run --cwd packages/shm-native test:capability:bun

      - name: Workspace graph has no sibling checkout or metadata stub
        run: |
          set -euo pipefail
          # Every path dependency must resolve inside this checkout. A sibling
          # source checkout or a metadata-only stub resolves outside it.
          cargo +1.98 metadata --locked --format-version 1 \
            | bun -e '
              const meta = JSON.parse(await Bun.stdin.text());
              const root = meta.workspace_root + "/";
              const outside = meta.packages
                .filter((p) => p.source === null && !p.manifest_path.startsWith(root))
                .map((p) => p.name + " -> " + p.manifest_path);
              const stubs = meta.packages
                .filter((p) => p.source === null && p.targets.length === 0)
                .map((p) => p.name);
              if (outside.length || stubs.length) {
                console.error("path dependencies outside the workspace:", outside);
                console.error("packages without targets:", stubs);
                process.exit(1);
              }
              console.log("workspace graph: " + meta.packages.filter((p) => p.source === null).length + " local packages, all inside " + root);
            '
