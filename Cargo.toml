[workspace]
resolver = "3"
members = [
    "crates/cache-stability",
    "crates/lease",
    "crates/storage-types",
    "crates/storage",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ahrav/eidnara"
publish = false

[workspace.dependencies]
storage-types = { path = "crates/storage-types" }
lease = { path = "crates/lease" }
