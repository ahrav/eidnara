rules:
# The body admits `-`, so this rule carries no trailing word boundary: one would reject
# a body ending in `-`, because neither it nor end-of-input is a word position, and the
# length floor leaves no shorter body to fall back to.
- name: magic-anthropic-api-key
  regex: '\bsk-ant-(?:api03-|admin01-)?[A-Za-z0-9_-]{32,}'
  anchors: [sk-ant-]
  radius: 256
  entropy:
    min_bits_per_byte: 4.0
    min_len: 16
    max_len: 256
  upstream_parity: true
# The `T3BlbkFJ` marker prevents matches on `sk-ant-` keys and bare `sk-` identifiers.
# A looser shape than the corpus `openai-api-key` rule would let this overlay report a candidate the corpus rejects.
- name: magic-openai-api-key
  regex: '\b(?:sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})\b'
  anchors: [T3BlbkFJ]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  upstream_parity: true
- name: magic-github-pat
  regex: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
  anchors: [github_pat_]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: github_fine_grained_pat
  upstream_parity: true
- name: magic-github-token
  regex: '\b(?:gh[opsu]|ghr)_[A-Za-z0-9]{36}\b'
  anchors: [ghp_, gho_, ghs_, ghu_, ghr_]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: crc32_base62
    prefix_skip: 4
    payload_len: 30
    checksum_len: 6
  upstream_parity: true
# Digits are not part of the corpus `huggingface-access-token` alphabet.
- name: magic-huggingface-token
  regex: '\bhf_[A-Za-z]{34}\b'
  anchors: [hf_]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  upstream_parity: true
# The 16 characters after the prefix are base32, so `0`, `1`, `8`, and `9` are invalid.
- name: magic-aws-access-key-id
  regex: '\b(?:AKIA|ASIA)[A-Z2-7]{16}\b'
  anchors: [AKIA, ASIA]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: aws_access_key
  upstream_parity: true
- name: magic-slack-token
  regex: '\b(?:xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*|xoxb-[0-9]{8,14}-[a-zA-Z0-9]{18,26}|xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}|xox[os]-[0-9]+-[0-9]+-[0-9]+-[a-fA-F0-9]+|xox[ar]-(?:[0-9]-)?[0-9a-zA-Z]{8,48}|(?i:xoxe-[0-9]-[A-Z0-9]{146})|(?i:xoxe\.xox[bp]-[0-9]-[A-Z0-9]{163,166}))'
  anchors: [xox]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: slack_token
  upstream_parity: true
- name: magic-google-api-key
  regex: '\bAIza[A-Za-z0-9_-]{35}\b'
  anchors: [AIza]
  radius: 256
  entropy:
    min_bits_per_byte: 4.0
    min_len: 16
    max_len: 256
  upstream_parity: true
# `upstream_parity` above puts the vendor rules inside the engine's safelists.
# The rules below declare their own value_suppressors_any instead.
- name: magic-bearer-token
  regex: '(?i)\bAuthorization[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*Bearer[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]+(?P<value>[A-Za-z0-9._~+/=-]{8,})'
  anchors: [authorization]
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: &overlay_value_suppressors ['placeholder', 'PLACEHOLDER', 'example', 'EXAMPLE',
    'changeme', 'CHANGEME', 'redacted', 'REDACTED', 'dummy', 'DUMMY', 'notasecret', 'xxxx', 'XXXX',
    'your-', 'your_', 'YOUR-', 'YOUR_', 'insert_', 'INSERT_', 'todo', 'TODO', 'fixme', 'FIXME',
    '${', '{{']
- name: magic-jwt
  regex: '\beyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{10,}'
  anchors: [eyJ]
  radius: 256
# A non-delimiting quote is content, and a backslash-escaped delimiter is content;
# a value class that stopped at either would report a truncated secret span.
- name: magic-keyed-double-quoted
  regex: '(?i)"(?P<key>(?:[^"\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^"\\]|\\.)*)"[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*"(?P<value>(?:[^"\\]|\\.)*)"'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-single-quoted
  regex: '(?i)''(?P<key>(?:[^''\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^''\\]|\\.)*)''[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*''(?P<value>(?:[^''\\]|\\.)*)'''
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-double-single
  regex: '(?i)"(?P<key>(?:[^"\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^"\\]|\\.)*)"[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*''(?P<value>(?:[^''\\]|\\.)*)'''
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-single-double
  regex: '(?i)''(?P<key>(?:[^''\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^''\\]|\\.)*)''[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*"(?P<value>(?:[^"\\]|\\.)*)"'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
# An unquoted value ends at a structural delimiter. Accepting one as content makes a
# trailing command or comment part of the candidate, where a suppressor word in it
# discards the whole finding and leaves the credential in place. A value that contains
# one has to be quoted, which the quoted rules below match in full.
# These rules declare `unicode: true` so a class may name a code point above ASCII, and
# spell the separator set out rather than using `\s`. The set is the one JavaScript
# treats as whitespace, which the engine on the other side of the shared fixture also
# uses: it adds U+FEFF, which is not `White_Space`, and omits U+0085, which is. Unicode
# `\s` would end an unquoted value at U+0085 and publish the rest of the credential.
# The separator and the value boundary read the same set, because a code point treated
# as a separator before the value has to end the value as well.
# The leading `\b` stays ASCII-only. A Unicode boundary does not hold between a
# non-ASCII word character and a key name, so a key preceded by one would not be
# recognised as keyed and would lose the label its key states.
# Rust regex has no backreference, so one rule cannot pair its own quotes; a shared
# optional quote instead truncates a quoted value at its first space.
- name: magic-keyed-assignment
  regex: '(?i)(?-u:\b)(?P<key>[A-Za-z0-9_.-]*(?:key|token|secret|password|auth|bearer|credential)[A-Za-z0-9_.-]*)[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*(?P<value>(?:[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}''"`;&|<>()$\\]|\\.)+)'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-assignment-double-quoted
  regex: '(?i)(?-u:\b)(?P<key>[A-Za-z0-9_.-]*(?:key|token|secret|password|auth|bearer|credential)[A-Za-z0-9_.-]*)[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*"(?P<value>(?:[^"\\]|\\.)*)"'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-assignment-single-quoted
  regex: '(?i)(?-u:\b)(?P<key>[A-Za-z0-9_.-]*(?:key|token|secret|password|auth|bearer|credential)[A-Za-z0-9_.-]*)[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*''(?P<value>(?:[^''\\]|\\.)*)'''
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
# Credential forms that the rules above leave in the text. Every rule from here on is an
# addition: the rules above are evaluated as they are, and a finding of this document is the
# union of what each rule reports.
#
# Value grammar. `SEP` is the separator set of the keyed rules above; a line break is one of
# LF, VT, FF, CR, U+2028, U+2029, and a blank is any other member of `SEP`.
#
# The value WORD of the option, field, password-assignment, and client rules is reported
# whole, quotes included. It is read left to right:
#   - at its start, one or more sections in double quotes, single quotes, or backquotes,
#     each closed on its line by the first quote that no backslash escapes, and the
#     double-quoted section that text serialized once writes (`\"...\"`); blanks inside a
#     section belong to the word;
#   - then every character outside `SEP` (a quote, `$`, a backslash, `;`, a bracket), and a
#     backslash followed by a blank.
# A word therefore ends at a blank, a line break, or the end of the text, and at nothing
# else. In serialized text the word runs through an escaped line break (`\n`, `\r`,
# `\u000a`, `\u000d`) to the next blank.
#
# | Rule | Reads | Value |
# | --- | --- | --- |
# | magic-option-value | `--name WORD`, `-name WORD` on one line | WORD that begins with a character other than `-` |
# | magic-field-value | `name: WORD` where WORD ends its line; blanks and a `#` comment may follow | WORD whose leading quote, when it has one, opens a section |
# | magic-field-value-serialized | `name: WORD` where WORD holds a serialized line break after its quoted sections | WORD whose leading quote, when it has one, opens a section |
# | magic-password-suffix-assignment | `XPASSWORD=WORD`, the name ending in `PASSWORD` or `password` joined to a letter of the same case or a digit | WORD |
# | magic-secret-digits | `name=DIGITS`, `name: DIGITS` with a blank after `:`, `"name": "DIGITS"`, the name ending in `password` or `secret` | 4 or more digits that are the whole assigned word |
# | magic-url-userinfo | `scheme://user:VALUE@` | from the first `:` of the authority to its last `@`; no separator, `/`, `?`, `#`, quote, backquote, angle bracket, or backslash |
# | magic-basic-authorization | `Authorization: Basic VALUE` | 4 or more Base64 characters of either alphabet and up to two `=`, decoding to `user:password` |
# | magic-client-password-attached | `mysql ... -pWORD` (MySQL and MariaDB clients) | WORD |
# | magic-client-password-option | `sshpass -p WORD`, `<client> login ... -p WORD`, attached or after up to 8 blanks | WORD that begins with a character other than `-` |
# | magic-private-key-body | the lines under a `-----BEGIN ... PRIVATE KEY-----` header | lines of 16 or more Base64 characters, then one shorter line that is a whole line |
#
# A name counts for the option and field rules when its last word is `password`, `secret`,
# `token`, or a `key` qualified as `api`, `auth`, `access`, `account`, or `secret`: a plural
# names a count (`--max-tokens`), and a trailing word such as `-file` names a reference.
# A key may follow a line break or a tab that serialized text writes as `\n`, `\r`,
# `\t`, `\u000a`, `\u000d`, or `\u0009`.
#
# Gates. `credential_form` names the reading of a WORD. The gates read the word's text:
# the word up to its first serialized line break, with the `,`, `;`, and surplus closing
# brackets that end it and one pair of enclosing quotes taken off. A word whose text is one
# of these stand-ins is left as written, whole:
#   - every form: a mask (`***`, punctuation alone), a reference (`$NAME`, `%NAME%`, a
#     backquoted command, `os.environ/DB_PASSWORD`), a template (`<name>`, `{name}`,
#     `[name]`, `%s`), and the stand-in words of `value_suppressors_any`;
#   - option, field, client, and URL forms: a plain word (letters of any script, `_`, `-`),
#     a file path, a URL, an attribute list (`id=npm,src=.npmrc`), and a port with a
#     property list;
#   - option, field, password-assignment, and client forms: a scalar (a number, a boolean,
#     a null, a duration). A PIN of 4 or more digits is a value under a name that ends in
#     `password` or `secret` and after a client's `-p`;
#   - bare text of the option, field, and password-assignment forms: a member path
#     (`config.token`);
#   - bare text of the field form: text followed directly by `,`, `;`, or a closing bracket,
#     text that holds a bracket, `,`, `;`, or a backquote, text that begins with a YAML
#     indicator (`& * ! | > % @ #`), and a GraphQL non-null scalar (`String!`);
#   - the option form: the word after an option whose name begins with `no`;
#   - the client forms: a port mapping (`8080:80`).

# A command-line option and its value as the next word of the line.
- name: magic-option-value
  regex: '(?i)(?:\\(?:[nrt]|u000[aAdD9])|(?-u:\B))--?(?P<key>[A-Za-z0-9_.-]*?(?:password|secret|token|(?:api|auth|access|account|secret)[-_.]?key))[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]+(?P<value>(?:(?:\\"(?:[^"\\\n\x0B\f\r\x{2028}\x{2029}]|\\{4}|\\{3}"|\\{1,3}[^"\\\n\x0B\f\r\x{2028}\x{2029}])*\\"|"(?:[^"\\\n\x0B\f\r\x{2028}\x{2029}]|\\[^\n\x0B\f\r\x{2028}\x{2029}])*"|''[^''\n\x0B\f\r\x{2028}\x{2029}]*''|`[^`\n\x0B\f\r\x{2028}\x{2029}]*`)+(?:\\[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}])*|(?:\\[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}-])(?:\\[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}])*))'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: option_value
# A `name: value` line of a configuration file, a header dump, or a program's report.
# The word ends its line; blanks and then a `#` comment may follow it.
- name: magic-field-value
  regex: '(?i)(?:\\(?:[nrt]|u000[aAdD9])|(?-u:\b))(?P<key>[A-Za-z0-9_.-]*?(?:password|secret|token|(?:api|auth|access|account|secret)[-_.]?key))[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]+(?P<value>(?:(?:\\"(?:[^"\\\n\x0B\f\r\x{2028}\x{2029}]|\\{4}|\\{3}"|\\{1,3}[^"\\\n\x0B\f\r\x{2028}\x{2029}])*\\"|"(?:[^"\\\n\x0B\f\r\x{2028}\x{2029}]|\\[^\n\x0B\f\r\x{2028}\x{2029}])*"|''[^''\n\x0B\f\r\x{2028}\x{2029}]*''|`[^`\n\x0B\f\r\x{2028}\x{2029}]*`)+(?:\\[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}])*|(?:\\[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]|\\[^"\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}"''`\\])(?:\\[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}])*))(?:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]+#|[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*(?:[\n\x0B\f\r\x{2028}\x{2029}]|\z))'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: field_value
# The same field in serialized text, where the line break after the value is written as an
# escape: the word holds that escape and runs to the next blank.
- name: magic-field-value-serialized
