[package]
name = "memory-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Durable memory store: per-session CoreState, compartments, notes, tags, and the Dreamer receipt ledger, with an app-level row_version CAS inside storage's epoch-fenced transaction."

[dependencies]
context-core = { workspace = true }
cache-stability = { workspace = true }
storage = { workspace = true, features = ["sqlite"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# Public seed helpers for sibling crates' tests (the daemon composes over this
# store and needs to populate it). Gated so the writers never ship in
# production builds.
test-support = ["storage/test-support"]

[dev-dependencies]
# Self dev-dependency so integration tests see the `test-support` fixtures.
memory-store = { path = ".", features = ["test-support"] }
md5 = "0.7"
tempfile = { workspace = true }
