rules:
# The body admits `-`, so this rule carries no trailing word boundary: one would reject
# a body ending in `-`, because neither it nor end-of-input is a word position, and the
# length floor leaves no shorter body to fall back to.
- name: magic-anthropic-api-key
  regex: '\bsk-ant-(?:api03-|admin01-)?[A-Za-z0-9_-]{32,}'
  anchors: [sk-ant-]
  radius: 256
  entropy:
    min_bits_per_byte: 4.0
    min_len: 16
    max_len: 256
  upstream_parity: true
# The `T3BlbkFJ` marker prevents matches on `sk-ant-` keys and bare `sk-` identifiers.
# A looser shape than the corpus `openai-api-key` rule would let this overlay report a candidate the corpus rejects.
- name: magic-openai-api-key
  regex: '\b(?:sk-(?:proj|svcacct|admin)-(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})T3BlbkFJ(?:[A-Za-z0-9_-]{74}|[A-Za-z0-9_-]{58})|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})\b'
  anchors: [T3BlbkFJ]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  upstream_parity: true
- name: magic-github-pat
  regex: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
  anchors: [github_pat_]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: github_fine_grained_pat
  upstream_parity: true
- name: magic-github-token
  regex: '\b(?:gh[opsu]|ghr)_[A-Za-z0-9]{36}\b'
  anchors: [ghp_, gho_, ghs_, ghu_, ghr_]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: crc32_base62
    prefix_skip: 4
    payload_len: 30
    checksum_len: 6
  upstream_parity: true
# Digits are not part of the corpus `huggingface-access-token` alphabet.
- name: magic-huggingface-token
  regex: '\bhf_[A-Za-z]{34}\b'
  anchors: [hf_]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  upstream_parity: true
# The 16 characters after the prefix are base32, so `0`, `1`, `8`, and `9` are invalid.
- name: magic-aws-access-key-id
  regex: '\b(?:AKIA|ASIA)[A-Z2-7]{16}\b'
  anchors: [AKIA, ASIA]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: aws_access_key
  upstream_parity: true
- name: magic-slack-token
  regex: '\b(?:xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*|xoxb-[0-9]{8,14}-[a-zA-Z0-9]{18,26}|xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}|xox[os]-[0-9]+-[0-9]+-[0-9]+-[a-fA-F0-9]+|xox[ar]-(?:[0-9]-)?[0-9a-zA-Z]{8,48}|(?i:xoxe-[0-9]-[A-Z0-9]{146})|(?i:xoxe\.xox[bp]-[0-9]-[A-Z0-9]{163,166}))'
  anchors: [xox]
  radius: 256
  entropy:
    min_bits_per_byte: 3.0
    min_len: 16
    max_len: 256
  offline_validation:
    type: slack_token
  upstream_parity: true
- name: magic-google-api-key
  regex: '\bAIza[A-Za-z0-9_-]{35}\b'
  anchors: [AIza]
  radius: 256
  entropy:
    min_bits_per_byte: 4.0
    min_len: 16
    max_len: 256
  upstream_parity: true
# `upstream_parity` above puts the vendor rules inside the engine's safelists.
# The rules below declare their own value_suppressors_any instead.
- name: magic-bearer-token
  regex: '(?i)\bAuthorization[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*Bearer[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]+(?P<value>[A-Za-z0-9._~+/=-]{8,})'
  anchors: [authorization]
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: &overlay_value_suppressors ['placeholder', 'PLACEHOLDER', 'example', 'EXAMPLE',
    'changeme', 'CHANGEME', 'redacted', 'REDACTED', 'dummy', 'DUMMY', 'notasecret', 'xxxx', 'XXXX',
    'your-', 'your_', 'YOUR-', 'YOUR_', 'insert_', 'INSERT_', 'todo', 'TODO', 'fixme', 'FIXME',
    '${', '{{']
- name: magic-jwt
  regex: '\beyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{10,}'
  anchors: [eyJ]
  radius: 256
# A non-delimiting quote is content, and a backslash-escaped delimiter is content;
# a value class that stopped at either would report a truncated secret span.
- name: magic-keyed-double-quoted
  regex: '(?i)"(?P<key>(?:[^"\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^"\\]|\\.)*)"[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*"(?P<value>(?:[^"\\]|\\.)*)"'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-single-quoted
  regex: '(?i)''(?P<key>(?:[^''\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^''\\]|\\.)*)''[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*''(?P<value>(?:[^''\\]|\\.)*)'''
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-double-single
  regex: '(?i)"(?P<key>(?:[^"\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^"\\]|\\.)*)"[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*''(?P<value>(?:[^''\\]|\\.)*)'''
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-single-double
  regex: '(?i)''(?P<key>(?:[^''\\]|\\.)*(?:key|token|secret|password|auth|bearer|credential)(?:[^''\\]|\\.)*)''[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*"(?P<value>(?:[^"\\]|\\.)*)"'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
# An unquoted value ends at a structural delimiter. Accepting one as content makes a
# trailing command or comment part of the candidate, where a suppressor word in it
# discards the whole finding and leaves the credential in place. A value that contains
# one has to be quoted, which the quoted rules below match in full.
# These rules declare `unicode: true` so a class may name a code point above ASCII, and
# spell the separator set out rather than using `\s`. The set is the one JavaScript
# treats as whitespace, which the engine on the other side of the shared fixture also
# uses: it adds U+FEFF, which is not `White_Space`, and omits U+0085, which is. Unicode
# `\s` would end an unquoted value at U+0085 and publish the rest of the credential.
# The separator and the value boundary read the same set, because a code point treated
# as a separator before the value has to end the value as well.
# The leading `\b` stays ASCII-only. A Unicode boundary does not hold between a
# non-ASCII word character and a key name, so a key preceded by one would not be
# recognised as keyed and would lose the label its key states.
# Rust regex has no backreference, so one rule cannot pair its own quotes; a shared
# optional quote instead truncates a quoted value at its first space.
- name: magic-keyed-assignment
  regex: '(?i)(?-u:\b)(?P<key>[A-Za-z0-9_.-]*(?:key|token|secret|password|auth|bearer|credential)[A-Za-z0-9_.-]*)[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*(?P<value>(?:[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}''"`;&|<>()$\\]|\\.)+)'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-assignment-double-quoted
  regex: '(?i)(?-u:\b)(?P<key>[A-Za-z0-9_.-]*(?:key|token|secret|password|auth|bearer|credential)[A-Za-z0-9_.-]*)[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*"(?P<value>(?:[^"\\]|\\.)*)"'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
- name: magic-keyed-assignment-single-quoted
  regex: '(?i)(?-u:\b)(?P<key>[A-Za-z0-9_.-]*(?:key|token|secret|password|auth|bearer|credential)[A-Za-z0-9_.-]*)[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*''(?P<value>(?:[^''\\]|\\.)*)'''
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  reject_scalars: true
  value_suppressors_any: *overlay_value_suppressors
# Credential forms that the rules above leave in the text. Every rule from here on is an
# addition: the rules above are evaluated as they are, and a finding of this document is the
# union of what each rule reports. The added rules are named `magic-value-*`, which sorts
# after every rule above, so the evaluator runs each rule above before the first added rule.
#
# Value grammar. `SEP` is the separator set of the keyed rules above; a line break is one of
# LF, VT, FF, CR, U+2028, U+2029, and a blank is any other member of `SEP`.
#
# The option, field, password-assignment, and client rules match the lead of their form
# (the name and what separates it from the value) and capture the one character before the
# value. `credential_form` names how the evaluator reads the value WORD from there
# (`read_word` in `evaluator.rs`), so the word of a lead is the same whatever precedes the
# lead. The WORD is reported whole, quotes included. It is read left to right in one pass:
#   - at its start, sections in double quotes, single quotes, or backquotes, each closed on
#     its line by the first quote of its kind that no backslash escapes, and the
#     double-quoted section that text serialized once writes (`\"...\"`); blanks inside a
#     section belong to the word; a quote whose section stays open is a character of the
#     word, and a section still open 32 KiB after it opens fails the scan closed;
#   - then every character outside `SEP` (a quote, `$`, `;`, a bracket); a backslash takes
#     the blank or the backslash after it into the word.
# A word therefore ends at a blank, a line break, or the end of the text. In serialized
# text the word runs through an escaped line break (`\n`, `\r`, `\u000a`, `\u000d`) to
# the next blank.
#
# | Rule | Reads | Value |
# | --- | --- | --- |
# | magic-value-option | `--name WORD`, `-name WORD` on one line | WORD that begins with a character other than `-` |
# | magic-value-field | `name: WORD` | WORD that ends its line (blanks and then a `#` comment may follow it; 1,024 bytes of blanks count as the line's end), or WORD whose part after the sections holds a serialized line break |
# | magic-value-password-assignment | `XPASSWORD=WORD`, the name ending in `PASSWORD` or `password` joined to a letter of the same case or a digit | WORD |
# | magic-value-digits | `name=DIGITS`, `name: DIGITS` with a blank after `:`, `"name": DIGITS`, the name ending in `password` or `secret` | 4 or more digits that are the whole assigned word: only quotes, `,`, `;`, and closing brackets follow them up to the next blank or `&` |
# | magic-value-digits-quoted | the same names before `=` or `:` and digits in quotes (`"name": "DIGITS"`, `name='DIGITS'`) | 4 or more digits between two quotes |
# | magic-value-url-userinfo | `scheme://user:VALUE@` | from the first `:` of the authority to its last `@`; no separator, `/`, `?`, `#`, quote, backquote, angle bracket, or backslash |
# | magic-value-basic-authorization | `Authorization: Basic VALUE` on one line | 4 or more Base64 characters of either alphabet and up to two `=`, decoding to `user:password` |
# | magic-value-client-attached | `mysql ... -pWORD` (MySQL and MariaDB clients) | WORD |
# | magic-value-client-option | `sshpass -p WORD`, `<client> login ... -p WORD`, attached or after at most 8 blanks | WORD that begins with a character other than `-` |
# | magic-value-private-key-body | the lines under a `-----BEGIN ... PRIVATE KEY-----` header | lines that begin with 16 or more Base64 characters, then one shorter line that is a whole line |
#
# A name counts for the option and field rules when its last word is `password`, `secret`,
# `token`, or a `key` qualified as `api`, `auth`, `access`, `account`, or `secret`: a plural
# names a count (`--max-tokens`), and a trailing word such as `-file` names a reference.
# A key may follow a line break or a tab that serialized text writes as `\n`, `\r`,
# `\t`, `\u000a`, `\u000d`, or `\u0009`.
#
# Gates. The gates read the word's text. For a word that begins with a quoted section the
# text is what that section holds. For any other word the text is the word up to its first
# serialized line break or the first quote that closes a string around the value (a quote
# before `,`, `;`, `:`, a closing bracket, or the end of the word), with the `,`, `;`, and
# surplus closing brackets that end it taken off. The rest of the word is replaced with the
# value and decides nothing. A word whose text is one of these stand-ins is left as
# written, whole:
#   - every form: a mask (`***`, punctuation alone), a reference (`$NAME`, `%NAME%`, a
#     backquoted command, `os.environ/DB_PASSWORD`), a template (`%s`, or bracketed names
#     such as `<name>`, `{name}`, `[name]`, `<file>|<text>` with only punctuation between
#     and after them), and the stand-in words of `value_suppressors_any`;
#   - option, field, client, and URL forms: plain words (ASCII letters, `_`, `-`, blanks
#     inside quotes, and characters outside ASCII other than the symbols a keyboard types,
#     U+00A1 to U+00BF, U+00D7, U+00F7, and the currency signs U+20A0 to U+20CF; a closing
#     `.`, `:`, `,`, or bracket may follow), a file path, a URL, an attribute list
#     (`id=npm,src=.npmrc`), and a port with a property list (`1433;database=sales`);
#   - option, field, password-assignment, and client forms: a scalar (a number, a boolean,
#     a null, a duration). A PIN of 4 or more digits is a value under a name that ends in
#     `password` or `secret` and after a client's `-p`;
#   - bare text of the option, field, and password-assignment forms: a member path
#     (`config.token`);
#   - bare text of the field form: text followed directly by `,`, `;`, or a closing bracket,
#     text that holds a bracket, `,`, `;`, or a backquote, text that begins with a YAML
#     indicator (`& * ! | > % @ #`), and a GraphQL non-null scalar (`String!`);
#   - the option form: the word after an option whose name's first word is `no`
#     (`--no-password`);
#   - the client forms: a port mapping (`8080:80`).

# A command-line option; its value is the next word of the line.
- name: magic-value-option
  regex: '(?:\\(?:[nrt]|u000[aAdD9])|(?-u:\B))--?(?P<key>(?i:[A-Za-z0-9_.-]*?(?:password|secret|token|(?:api|auth|access|account|secret)[-_.]?key)))[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*(?P<value>[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}])'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: option_value
# A `name: value` line of a configuration file, a header dump, or a program's report, real
# or serialized.
- name: magic-value-field
  regex: '(?:\\(?:[nrt]|u000[aAdD9])|(?-u:\b))(?P<key>(?i:[A-Za-z0-9_.-]*?(?:password|secret|token|(?:api|auth|access|account|secret)[-_.]?key)))[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*(?P<value>[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}])'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: field_value
# An assignment whose name ends in `password` joined to the letters before it, as in
# `PGPASSWORD=VALUE psql`. The key gate of the keyed rules reads such a name as one word
# and declines it unless a credential qualifier precedes `password`. The join holds one
# letter case (`PGPASSWORD`, `pgpassword`); the keyed rules read a camel-case name
# (`userPassword`) word by word. The pattern also takes the run of characters outside `SEP`
# after the `=`, so a second such name inside that run is text of the first name's word
# and the runs this rule reads are disjoint.
- name: magic-value-password-assignment
  regex: '(?-u:\b)[A-Za-z0-9_.-]*(?:[A-Z0-9]PASSWORD|[a-z0-9]password)(?P<value>=)[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}]*'
  anchors: [password]
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: password_assignment
# Digits under a key whose last word is `password` or `secret`: a PIN or a numeric
# password. The keyed rules above read a number as a scalar, which it is under `token` and
# `key` (`max_tokens=4096`). The form reports the digits when they are the whole assigned
# word: up to the next blank or `&`, only quotes, `,`, `;`, and closing brackets follow
# them. `1234.5`, `1234-abcd`, and `1234,Zx9` stay with the rules above.
- name: magic-value-digits
  regex: '(?:\\(?:[nrt]|u000[aAdD9])|(?-u:\b))(?P<key>(?i:[A-Za-z0-9_.-]*(?:password|secret)))(?:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*=[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*|[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]+|\\?["''][\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*)(?P<value>[0-9]{4,})'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
  credential_form: digits
# The same digits between two quotes. The closing quote follows the last digit, so a quoted
# text that only begins with digits (`"1234 abcd"`) stays with the rules above.
- name: magic-value-digits-quoted
  regex: '(?:\\(?:[nrt]|u000[aAdD9])|(?-u:\b))(?P<key>(?i:[A-Za-z0-9_.-]*(?:password|secret)))(?:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*[=:][\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*|\\?["''][\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*)\\?["''](?P<value>[0-9]{4,})\\?["'']'
  anchors: [key, token, secret, password, auth, bearer, credential]
  radius: 256
  unicode: true
  key_group: key
  value_group: value
# RFC 7617 credentials: the Base64 of `user:password`, which anyone can decode. The
# validator requires that decoding, so `Basic authentication` in prose is left alone. The
# header stands on one line, so a header without a value ends at its line.
- name: magic-value-basic-authorization
  regex: '(?:\\(?:[nrt]|u000[aAdD9])|\b)(?i:Authorization)[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*:[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]*(?i:Basic)[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]+(?P<value>[A-Za-z0-9+/_-]{4,}={0,2})'
  anchors: [authorization]
  radius: 256
  unicode: true
  value_group: value
  offline_validation:
    type: basic_credentials
# RFC 3986 userinfo with a password. The user name runs to the first `:` and the password
# ends at the last `@` of the authority. A leading `$`, `[`, or `{` marks a variable or a
# template, and a leading `%` opens a percent-encoded octet.
- name: magic-value-url-userinfo
  regex: '[A-Za-z][A-Za-z0-9+.-]*://[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}/?#:''"`<>\\]*:(?P<value>(?:%[0-9A-Fa-f]{2}|[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}/?#''"`<>\\$%\[{])[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}/?#''"`<>\\]*)@'
  anchors: ['://']
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: url_password
# `-p` names a password only for a program that defines it so; elsewhere it is a port, a
# path, or a process id. The MySQL and MariaDB clients read the password attached to the
# option. The program stands as a command word (at the start of the text or after a
# separator, a quote, or a shell operator), bare or under a `bin/` or `./` path. The option
# is the first ` -p` after it within 256 units of one command, where a unit is one character
# (a blank included) or a backslash and the character after it. A line break, `|`, `;`,
# `&`, and the escapes `\n`, `\r`, and `\u` end the command.
- name: magic-value-client-attached
  regex: '(?:^|[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}"''`(;&|=]|\\(?:[nrt]|u000[aAdD9]))(?:[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}"''`(;&|=]*bin/|\./)?(?:mysql|mysqldump|mysqladmin|mysqlimport|mysqlshow|mysqlcheck|mariadb|mariadb-dump|mariadb-admin)(?:\.exe)?[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}](?:(?:[^\n\x0B\f\r\x{2028}\x{2029}\x{85}|;&\\]|\\[^nru\n\x0B\f\r\x{2028}\x{2029}\x{85}]){0,255}?[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}])??-(?P<value>p)'
  anchors: [mysql, mariadb]
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: client_password
# `sshpass -p`, at most 8 blanks after `sshpass`, and the `login` subcommand of the
# registry and platform clients listed here, with `-p` within 256 units after `login`, take
# the password attached or after at most 8 blanks.
- name: magic-value-client-option
  regex: '(?:^|[\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}"''`(;&|=]|\\(?:[nrt]|u000[aAdD9]))(?:[^\t\n\x0B\f\r \x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}\x{2029}\x{202f}\x{205f}\x{3000}\x{feff}"''`(;&|=]*bin/|\./)?(?:sshpass(?:\.exe)?[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]{1,8}|(?:docker|podman|nerdctl|buildah|skopeo|oras|crane|helm|oc|cf|az)(?:\.exe)?[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]{1,8}(?:(?:registry|auth|acr)[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}]{1,8})?login(?-u:\b)(?:[^\n\x0B\f\r\x{2028}\x{2029}\x{85}|;&\\]|\\[^nru\n\x0B\f\r\x{2028}\x{2029}\x{85}]){0,256}?[\t \x{a0}\x{1680}\x{2000}-\x{200a}\x{202f}\x{205f}\x{3000}\x{feff}])-(?P<value>p)'
  anchors: [sshpass, login]
  radius: 256
  unicode: true
  value_group: value
  value_suppressors_any: *overlay_value_suppressors
  credential_form: client_password_option
# The body lines under a private-key header. The corpus `private-key` rule reports a whole
# block, header to footer; a block cut short by `head` or by an output limit ends before
# its footer, and its body lines are key material all the same. Up to four `Name: value`
# lines (PGP armor headers, `Proc-Type` and `DEK-Info` of an encrypted PEM) and one blank
# line may stand between the header and the body; lines may be indented and may end in
# blanks, and a line break may be written `\n` or `\u000a`. A body line begins with 16 or
# more Base64 characters, and those characters are the reported part of it: an output
# limit can cut the last line and append its own marker. A header followed by `...` or by
# prose of shorter words stays as written. A last line of 1 to 15 Base64 characters joins
# the body when it is a whole line with at most 256 blanks after it. The two unnamed
# groups are the body with and without that line; the evaluator reports the one that
# matched.
- name: magic-value-private-key-body
  regex: '(?i:-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----)(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z][A-Za-z0-9-]{0,30}:[^\n\\]{0,200}){0,4}(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*)?[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*(?:([A-Za-z0-9+/=]{16,}(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z0-9+/=]{16,})*[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z0-9+/=]{1,15})[\t ]{0,256}(?:(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))|\\?["''`]|\z)|([A-Za-z0-9+/=]{16,}(?:[\t ]*(?:\r?\n|(?:\\r|\\u000[dD])?(?:\\n|\\u000[aA]))[\t ]*[A-Za-z0-9+/=]{16,})*))'
  anchors: ['-----begin']
  radius: 256
