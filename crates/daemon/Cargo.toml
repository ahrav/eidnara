[package]
name = "daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autobins = false
description = "Eidnara host component: harness-agnostic cache-stability transform backed by the single-writer memory store and the kernel."

[[example]]
name = "direct_host_fixture"
path = "examples/direct_host_fixture.rs"
required-features = ["direct-host-fixture"]

[[example]]
name = "eval_runner"
path = "examples/eval_runner/main.rs"
required-features = ["eval-runner"]
test = true

[[bin]]
name = "eidnara-host"
path = "src/bin/eidnara-host.rs"

[dependencies]
rustix = { workspace = true, features = ["fs", "process"] }
cache-stability = { workspace = true }
context-core = { workspace = true }
memory-store = { workspace = true }
kernel = { workspace = true }
retrieval = { workspace = true }
storage = { workspace = true }
# The search projection's fenced write closures speak the storage crate's
# rusqlite result type; already a transitive dependency through storage.
rusqlite = { workspace = true }
lease = { workspace = true }
# Lock-free snapshot swap for the kernel health projection; already a transitive
# dependency through gix, so it adds no new supply-chain root.
arc-swap = "1"
tokenizer = { workspace = true }
# Reads explicitly selected commit objects for the git source class with the same isolated gix APIs the kernel uses; no git CLI.
gix = { workspace = true }
host-runtime = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Provider context-overflow error patterns and phrase scanning; plain regex, no
# lookarounds.
regex = { workspace = true }
aho-corasick = { workspace = true }
memchr = { workspace = true }
# `signal` enables the `eidnara-host serve` SIGTERM handler.
tokio = { workspace = true, features = ["signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = { workspace = true }
getrandom = { workspace = true }
# Keyed credential identities in the active harness selection.
hmac = { workspace = true }
# Artifact pages cross the JSON ring as base64.
base64 = { workspace = true }
# Page decoding: SIMD with runtime dispatch and a scalar fallback; decodes
# the same inputs to the same bytes as `base64`'s STANDARD engine and rejects
# the same malformed ones.
base64-simd = "0.8"
# `clock` supplies `Local::now` for guidance dates and note evaluation; it pulls in the
# timezone-lookup crates.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
zeroize = { workspace = true }

[features]
direct-host-fixture = []
# The evaluator's campaign driver; an example, so it reaches the eval-core
# dev-dependency without adding a normal edge. It drives the direct-host
# fixture through the same seams the evaluator tests use, so it carries
# `test-support`.
eval-runner = ["test-support"]
# Exposes the request dispatcher and kernel lifecycle probes to integration
# tests in `tests/`; enabled through the self dev-dependency below and by
# `eval-runner`, never by a normal dependency.
test-support = ["host-runtime/test-support"]

[dev-dependencies]
storage = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
chrono-tz = "0.10"
tokio = { workspace = true, features = ["signal", "test-util"] }
# `memory-store` enables `test-support` only in dev-dependencies, so production builds exclude the feature.
memory-store = { workspace = true, features = ["test-support"] }
kernel = { workspace = true, features = ["test-support"] }
host-runtime = { workspace = true, features = ["test-support"] }
daemon = { path = ".", features = ["test-support"] }
eval-core = { workspace = true }
# The evaluator's shell reaches the retrieval fault seams only from tests.
retrieval = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
filetime = "0.2"
rcgen = { workspace = true }
