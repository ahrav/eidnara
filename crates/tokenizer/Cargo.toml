[package]
name = "tokenizer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Claude BPE token estimator for Eidnara: a bit-faithful Rust port of ai-tokenizer's claude encoding (tiktoken byte-BPE), used for m0 budget fitting."

[dependencies]
# tiktoken-rs provides the byte-BPE engine.
tiktoken-rs = "=0.11.0"
base64 = "0.22"
rustc-hash = "1.1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
