name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
# `main` keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are dead weight in a fresh checkout and bloat
  # the target cache.
  CARGO_INCREMENTAL: "0"
  # Line tables preserve file and line locations for backtraces and Valgrind.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

jobs:
  # Skipping a job needs positive evidence that none of its inputs changed.
  # `steps.filter` runs only for pull requests; missing outputs make every job run.
  #
  # `docs/` stays out of the Rust filters: the schema-migration step in `gates` rejects any manifest path or `include!` that reaches `docs/` or a `.md` file. commentlint: allow(JUDGE)
  # Tests read `release/` manifests and `docs/host-wire-protocol.md` at runtime, so `test` includes them in addition to `rust`. commentlint: allow(JUDGE)
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      test: ${{ steps.filter.outputs.test || 'true' }}
      shm: ${{ steps.filter.outputs.shm || 'true' }}
      native: ${{ steps.filter.outputs.native || 'true' }}
      ts: ${{ steps.filter.outputs.ts || 'true' }}
      manifests: ${{ steps.filter.outputs.manifests || 'true' }}
    steps:
      # dorny/paths-filter v4.0.3
      # Pull requests read the file list from the API; no checkout needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        if: github.event_name == 'pull_request'
        id: filter
        continue-on-error: true
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            cargo: &cargo
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'clippy.toml'
              - 'rustfmt.toml'
            shm:
              - *workflow
              - *cargo
              - 'crates/shm-transport/**'
            rust: &rust
              - *workflow
              - *cargo
              - 'crates/**'
              - 'packages/shm-native/Cargo.toml'
              - 'packages/shm-native/build.rs'
              - 'packages/shm-native/src/**'
            test:
              - *rust
              - 'release/**'
              - 'docs/host-wire-protocol.md'
            native:
              - *workflow
              - *cargo
              - 'crates/shm-transport/**'
              - 'crates/daemon/**'
              - 'packages/**'
              - 'scripts/**'
              - 'release/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
            ts:
              - *workflow
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'crates/*/gen/**'
            manifests:
              - *workflow
              - *cargo
              - '**/Cargo.toml'

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Predecessor tokens
        # `docs/plans/` is the only tracked path allowed to contain a
        # predecessor name; bracketed characters prevent `TOKENS` from matching
        # this workflow file.
        # `(^|[^0-9a-z])` and `([^0-9a-z]|$)` bound a token: `_` and `/` count
        # as boundaries under `-i`, and a longer identifier that merely contains
        # a name does not match.
        # `[-_[:space:]]*` lets the whole-file pass match two-word names split
        # across a line break and indentation.
        # `git grep` and `grep` exit 1 on no match; any other non-zero status is
        # a tool failure. NUL-delimited pathnames preserve embedded newlines.
        # The whole-file pass reads index blobs, so tracked symlinks are scanned
        # as link text rather than followed, and scanning each file separately
        # preserves each `grep` failure status.
        run: |
          set -euo pipefail
          TOKENS='(^|[^0-9a-z])(c[o]rtex[-_[:space:]]*kit'
          TOKENS+='|magi[c][-_[:space:]]*context|claustru[m]|m[c]tx'
          TOKENS+='|m[c])([^0-9a-z]|$)|(^|[^0-9a-z])c[k][-_]|(^'
          TOKENS+='|[^0-9a-z])(primitives|host)[@][0-9a-f]{7,40}([^0-9a-z]|$)'
          TOKENS+='|"(source_)?repo"[[:space:]]*:[[:space:]]*"(primitives'
          TOKENS+='|host)"'
          status=0
          git grep -n -I -i -E -e "$TOKENS" -- ':!docs/plans/' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "predecessor tokens found"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "git grep failed with exit $status"
            exit 1
          fi
          tracked="$RUNNER_TEMP/tracked-files"
          git ls-files -z -- ':!docs/plans/' > "$tracked"
          if [ ! -s "$tracked" ]; then
            echo "git ls-files listed no tracked files"
            exit 1
          fi
          status=0
          grep -z -i -E -e "$TOKENS" < "$tracked" | tr '\0' '\n' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "predecessor tokens found in a tracked pathname"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "grep failed with exit $status"
            exit 1
          fi
          found=0
          while IFS= read -r -d '' file; do
            if git show ":$file" |
              grep -I -i -z -E -e "$TOKENS" >/dev/null; then
              echo "$file"
              found=1
            else
              status=("${PIPESTATUS[@]}")
              if [ "${status[0]}" -ne 0 ] || [ "${status[1]}" -ne 1 ]; then
                echo "scan of $file failed: git show exit ${status[0]}," \
                  "grep exit ${status[1]}"
                exit 1
              fi
            fi
          done < "$tracked"
          if [ "$found" -ne 0 ]; then
            echo "predecessor tokens found across a line break"
            exit 1
          fi

      - name: Schema-migration identifiers
        # Version-ledger identifiers must not appear outside test files and
        # prose. Only the auto-discovered `tests/` target of a crate is a test
        # file; `src/tests/` is compiled into the crate and is scanned, as are
        # inline `#[cfg(test)]` modules. Every TypeScript file under `packages/`
        # is scanned because the bundle follows imports wherever they point.
        # The first pass is case-insensitive and needs a `_` or `(` after the
        # word, with no leading boundary so `runM[i]grations(` matches, and
        # ordinary prose in a doc comment passes. The second pass is
        # case-sensitive and matches `M[i]gration(s)` only where a type sits:
        # after a declaration keyword, before `::`, `{`, `<`, `>`, or `;`, after
        # `->`, plus `M[I]GRATIONS` and `fn m[i]grate`. A title-cased sentence
        # such as `/// M[i]gration from v1 is unsupported.` passes.
        # Cargo follows tracked symlinks but `git grep` does not; rejecting them
        # prevents compiled files from bypassing the scan. A manifest `path` or
        # `build` under `tests/` or `docs/`, a workspace member or dependency
        # path that passes through a `tests/` directory, or an `include!` or
        # `#[path]` in `src/` or a build script that reaches under `tests/` or
        # `docs/` or names a `.md` file would have the same effect and is
        # rejected too; TOML allows either quote and Rust allows a raw string; a
        # backslash escape or a multi-line string in a manifest path is refused
        # so no spelling can hide a directory name. Benches and examples may
        # borrow `tests/support/` through `#[path]`; they are not compiled into
        # the crate.
        # `git grep` exits 1 on no match; any other non-zero status is a tool
        # failure.
        run: |
          set -euo pipefail
          status=0
          git ls-files -s | grep '^120000 ' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "tracked symlinks are not scanned; replace them with files"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "git ls-files failed with exit $status"
            exit 1
          fi
          refuse() {
            local message=$1
            shift
            local status=0
            git grep -n -I "$@" || status=$?
            if [ "$status" -eq 0 ]; then
              echo "$message"
              exit 1
            fi
            if [ "$status" -ne 1 ]; then
              echo "git grep failed with exit $status"
              exit 1
            fi
          }
          manifest="(^|[^A-Za-z_])['\"]?(path|build)['\"]?[[:space:]]*="
          manifest+="[[:space:]]*(['\"]((\.\./)*(tests|docs)/|[^'\"]*\.md['\"])"
          manifest+="|\"[^\"]*\\\\|\"\"\"|''')|['\"][^'\"]*/tests/"
          message="a manifest compiles a file under tests/ or docs/ into the"
          message+=" crate, or spells a path with an escape or a multi-line"
          message+=" string; write it plainly"
          refuse "$message" -E "$manifest" -- '*Cargo.toml'
          include='include!\([^)]*(tests/|docs/|\.md)'
          include+='|#\[path[[:space:]]*=[[:space:]]*r?#*"[^"]*(tests/|docs/'
          include+='|\.md")'
          message="a src/ module or build script pulls an excluded file into"
          message+=" the crate; move the file"
          refuse "$message" -E "$include" \
            -- ':(glob)**/src/**' ':(glob)**/build.rs'
          paths=(':(exclude,glob)crates/*/tests/**' ':!docs/' ':!NOTICE'
            ':!*.md')
          ledger='schema[_]migrations|migrat(e|ions?)[_(]|ensure[_]?column'
          ledger+='|run[_]migrations|apply[_]migrations|latest[_]migration'
          ledger+='|bootstrap[_]migration|oldest[_]adoptable'
          refuse "schema-migration identifiers found" \
            -i -E "$ledger" -- "${paths[@]}"
          types='\bM[I]GRATIONS?\b|\b(struct|enum|trait|type|mod|impl'
          types+='|dyn)[[:space:]]+M[i]grations?\b|\bM[i]grations?(::|<|>|;'
          types+='|[[:space:]]*\{)|->[[:space:]]*M[i]grations?\b'
          types+='|\bfn m[i]grate\b'
          refuse "schema-migration identifiers found" \
            -E "$types" -- "${paths[@]}"

      # oven-sh/setup-bun v2.2.0
      # The workspace-graph step below also needs `bun -e`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      # actions/setup-node v7.0.0
      # The smart-note parity suite requires Node within @eidnara/opencode's engines.node range.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install TypeScript tooling
        if: needs.changes.result != 'success' || needs.changes.outputs.ts == 'true'
        run: bun install --frozen-lockfile

      - name: TypeScript
        if: needs.changes.result != 'success' || needs.changes.outputs.ts == 'true'
        run: bun run check:repo

      - name: Incident history and verifier gates
        # Both validators use the pull request base SHA or protected push `before` SHA.
        # An unprotected push, a scheduled run, and a manual dispatch have no trusted base, so the step is skipped there.
        # The validators import `typescript`, so the install above must have run: a path-filtered pull request without TypeScript changes installs here instead.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_protected)
        run: |
          if [ ! -d node_modules ]; then bun install --frozen-lockfile; fi
          bun run --cwd packages/e2e-tests validate:incident-history:ci
          bun run --cwd packages/e2e-tests validate:incident-verifiers:ci

      # `bun test` resolves QuickJS and the TUI from source and node_modules, so only these smokes exercise the shipped bundles.
      - name: Plugin bundle smokes
        if: needs.changes.result != 'success' || needs.changes.outputs.ts == 'true'
        run: bun run --cwd packages/opencode-plugin smoke

      - name: Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt

      - name: Rust format
        run: |
          cargo +1.98 fmt --all -- --check
          cargo +1.98 fmt --manifest-path crates/shm-transport/fuzz/Cargo.toml \
            --all -- --check

      - name: Workspace graph has no sibling checkout or metadata stub
        run: |
          set -euo pipefail
          # Every path dependency must resolve inside this checkout. A sibling
          # source checkout or a metadata-only stub resolves outside it.
          cargo +1.98 metadata --locked --format-version 1 \
            | bun -e '
              const meta = JSON.parse(await Bun.stdin.text());
              const root = meta.workspace_root + "/";
              const outside = meta.packages
                .filter((p) => p.source === null)
                .filter((p) => !p.manifest_path.startsWith(root))
                .map((p) => p.name + " -> " + p.manifest_path);
              const stubs = meta.packages
                .filter((p) => p.source === null && p.targets.length === 0)
                .map((p) => p.name);
              if (outside.length || stubs.length) {
                console.error("path dependencies outside the workspace:",
                  outside);
                console.error("packages without targets:", stubs);
                process.exit(1);
              }
              const local = meta.packages.filter((p) => p.source === null);
              console.log("workspace graph: " + local.length
                + " local packages, all inside " + root);
            '

  lint:
    name: lint (1.98)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal --component clippy

      # Swatinem/rust-cache v2.9.2
      # PRs restore `main`'s cache without saving, preventing a separate cache entry for each PR job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/shm-transport/fuzz -> target

      - name: Clippy
        run: >
          cargo +1.98 clippy --workspace --all-targets --all-features
          --locked -- -D warnings

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98 doc --workspace --no-deps --all-features --locked

      - name: No default features
        # `--all-features` is already covered by clippy above.
        # `--no-default-features` only clears each package's own `default`
        # set; a dependent that names `storage/sqlite` explicitly keeps it
        # enabled workspace-wide, so storage is also checked on its own.
        run: |
          cargo +1.98 check --workspace --no-default-features --locked
          cargo +1.98 check -p storage --no-default-features --locked

      - name: Fuzz workspace (excluded from the root workspace)
        run: >
          cargo +1.98 check --locked --bins
          --manifest-path crates/shm-transport/fuzz/Cargo.toml

  test-shards:
    name: test (1.98, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # taiki-e/install-action v2.87.8
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff
        with:
          tool: cargo-nextest@0.9.143

      - name: Tests
        # The `slice` partition applies after nextest filters the test list.
        run: >
          cargo +1.98 nextest run --profile ci --workspace --all-targets
          --all-features --locked --partition slice:${{ matrix.shard }}/2

      - name: Benches in test mode
        if: matrix.shard == 1
        # `.config/nextest.toml` keeps bench targets out of nextest.
        # `--bench '*'` selects only bench targets; `--benches` also runs library unit tests.
        run: cargo +1.98 test --workspace --all-features --locked --bench '*'

      - name: Doctests
        if: matrix.shard == 1
        # nextest does not run doctests.
        run: cargo +1.98 test --workspace --doc --all-features --locked

  test:
    name: test (1.98)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, test-shards]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    steps:
      - name: Verify test shards
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = success

  stable:
    name: lint and test (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchains
        id: toolchains
        # When stable resolves to the pinned compiler the lane would repeat
        # the 1.98 jobs byte for byte, so it stops here.
        run: |
          set -euo pipefail
          rustup toolchain install 1.98 --profile minimal
          rustup toolchain install stable --profile minimal --component clippy
          pinned=$(rustc +1.98 --version)
          stable=$(rustc +stable --version)
          echo "pinned: $pinned"
          echo "stable: $stable"
          if [ "$pinned" = "$stable" ]; then
            echo "stable is the pinned compiler; nothing new to check"
            echo "same=true" >> "$GITHUB_OUTPUT"
          fi

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.toolchains.outputs.same != 'true'
        env:
          # rust-cache keys on `rustc -vV`, which `rust-toolchain.toml`
          # would resolve to 1.98. commentlint: allow(JUDGE)
          RUSTUP_TOOLCHAIN: stable
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            crates/shm-transport/fuzz -> target

      - name: Clippy
        if: steps.toolchains.outputs.same != 'true'
        run: >
          cargo +stable clippy --workspace --all-targets --all-features
          --locked -- -D warnings

      - name: Tests
        if: steps.toolchains.outputs.same != 'true'
        run: >
          cargo +stable test --workspace --all-targets --all-features
          --locked

      - name: Fuzz workspace (excluded from the root workspace)
        if: steps.toolchains.outputs.same != 'true'
        run: >
          cargo +stable check --locked --bins
          --manifest-path crates/shm-transport/fuzz/Cargo.toml

  miri:
    name: unsafe boundary under Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # `shm-transport` has no path dependencies, so only its own sources reach Miri. commentlint: allow(JUDGE)
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.shm == 'true') }}
    env:
      # A dated nightly keeps this required gate reproducible; bump the
      # date deliberately.
      MIRI_TOOLCHAIN: nightly-2026-07-27
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: >
          rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal
          --component miri

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MIRI_TOOLCHAIN }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Miri
        # `cargo miri test` exits zero when its filter matches no tests, so
        # the final grep fails the step unless at least one test ran and
        # passed.
        run: |
          set -euo pipefail
          cargo "+$MIRI_TOOLCHAIN" miri setup
          cargo "+$MIRI_TOOLCHAIN" miri test -p shm-transport --lib --locked \
            -- lease:: backend::ring::miri 2>&1 | tee miri.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' miri.log

  valgrind:
    name: ring under valgrind memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.shm == 'true') }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: >-
        valgrind --tool=memcheck --leak-check=full
        --errors-for-leak-kinds=definite --trace-children=yes
        --error-exitcode=1
      EIDNARA_SHM_SKIP_TWO_PROCESS: "1"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ring tests
        run: cargo +1.98 test -p shm-transport --test ring --locked

  native-addon:
    name: native addon package (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    env:
      # The claimed-target flag makes an addon-load failure fail the suite
      # instead of skipping the tests that need the artifact.
      EIDNARA_SHM_NATIVE_CLAIMED_TARGET: "1"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install TypeScript tooling
        run: bun install --frozen-lockfile

      - name: Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # actions/setup-node v7.0.0; the E2E harness runs OpenCode, whose npm
      # package installs through Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0

      - name: Build and test the addon
        # The addon loads a release build of the cdylib; the package tests
        # then drive the setup handshake, ring geometry, buffer bounds, and
        # detachment through N-API.
        run: |
          bun run --cwd packages/shm-native build:native
          bun run --cwd packages/shm-native typecheck
          bun run --cwd packages/shm-native test
          bun run --cwd packages/shm-native test:capability:bun
          bun run --cwd packages/opencode-plugin test src/shared/host-client

      - name: Payload and tarball smoke
        run: |
          cargo +1.98 build -p daemon --bin eidnara-host --locked
          bun run payload:dev
          bun run smoke:tarballs

      - name: Rust-mode E2E
        # OpenCode is pinned to the version the harness closure under
        # `release/harness-closures/` names. The suite skips itself, with the
        # reason printed, when the shared-memory channel cannot start on the
        # runner's Bun; OpenCode embeds Bun, so the probe predicts the plugin.
        # The fixture contract probe requires the built native addon;
        # `check:repo` does not build it.
        # The Pi smoke fails if Node, the Pi package, or the built extension is
        # missing.
        env:
          EIDNARA_E2E_REQUIRE_PI: "1"
        run: |
          npm install -g opencode-ai@1.18.22
          cargo +1.98 build -p daemon --example direct_host_fixture \
            --features direct-host-fixture --locked
          bun run --cwd packages/e2e-tests test:fixture-contract
          bun run --cwd packages/e2e-tests validate-mode-manifest
          bun run --cwd packages/e2e-tests test:rust

  unlocked-deps:
    name: pinned toolchain with unlocked latest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # `cargo update` reads only the manifests, so on a pull request this lane reacts to manifest edits; the weekly schedule catches new registry releases. commentlint: allow(JUDGE)
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.manifests == 'true') }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install 1.98 --profile minimal

      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          # The lock file is regenerated below, so only the registry
          # index and sources are worth keeping.
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          git archive HEAD | tar -x -C "$scratch"
          cd "$scratch"
          cargo +1.98 update
          cargo +1.98 check --workspace --all-targets --all-features
