[package]
name = "host-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Directly linked host for the context, Synapse, and Broca components."

[lints.clippy]
duplicate_mod = "allow"

[dependencies]
serde = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
fastembed = { version = "=6.0.0", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
tokio = { workspace = true, features = ["process"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustix = { workspace = true, features = ["event", "fs", "net", "process", "thread"] }
getrandom = { workspace = true }
libc = { workspace = true }
shm-transport = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "signal"] }
rustix = { workspace = true, features = ["stdio"] }
criterion = "=0.8.2"
hdrhistogram = "=7.6.0"

[[test]]
name = "broca_subprocess"
harness = false

[[bench]]
name = "ipc_budget"
harness = false
