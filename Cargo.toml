[workspace]
resolver = "3"
members = [
    "crates/cache-stability",
    "crates/lease",
    "crates/storage-types",
    "crates/storage",
    "crates/shm-transport",
    "crates/tokenizer",
    "crates/host-runtime",
]
exclude = ["crates/shm-transport/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ahrav/eidnara"
publish = false

# Closure resolution re-hashes each launched node, and the Broca fixtures launch the ~100 MB debug test binary; unoptimized SHA-256 turns that into seconds per run. commentlint: allow(JUDGE)
[profile.dev.package.sha2]
opt-level = 3

[workspace.dependencies]
storage-types = { path = "crates/storage-types" }
lease = { path = "crates/lease" }
shm-transport = { path = "crates/shm-transport", default-features = false }
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
thiserror = "2"
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
getrandom = "0.2"
hmac = "0.12"
rustix = { version = "1.1.4" }
subtle = "2"
